<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Salmane El Maazouzi, Generative AI Engineer</title>
<desc id="desc">Ingénieur IA générative : RAG, agents, LLMOps, évaluation. En recherche active d'un poste en IA générative.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#eef1f4"/>
  </pattern>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .eyebrow { font: 600 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 3px; fill: #4338ca; }
  .name { font-weight: 700; font-size: 50px; fill: #1f2328; letter-spacing: -0.5px; }
  .tagline { font-size: 20px; fill: #59636e; }
  .chip { font-weight: 600; font-size: 15px; fill: #4338ca; }
  .status { font-weight: 600; font-size: 15px; fill: #1a7f37; }
  .num { font: 600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #59636e; }
  .step { font: 700 16px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f2328; }
  .detail { font: 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #59636e; }
  .flow { stroke: #6366f1; stroke-width: 2.5; stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  .node rect { animation: glow 3.6s ease-in-out infinite; animation-delay: inherit; }
  .pulse { fill: #1a7f37; transform-origin: 84px 289px; animation: pulse 2s ease-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @keyframes glow { 0%, 20%, 100% { stroke: #d0d7de; } 8% { stroke: #6366f1; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow, .node rect, .pulse { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="url(#bg)" stroke="#d0d7de"/>
<rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="url(#grid)"/>

<text x="64" y="78" class="eyebrow">GENERATIVE AI ENGINEER</text>
<text x="62" y="138" class="name">Salmane El Maazouzi</text>
<text x="64" y="182" class="tagline">Des systèmes LLM qui citent leurs sources, se testent et se mesurent.</text>
<rect x="64" y="214" width="53" height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/><text x="90.5" y="235" text-anchor="middle" class="chip">RAG</text><rect x="127" y="214" width="136" height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/><text x="195.0" y="235" text-anchor="middle" class="chip">Agents &amp; A2A</text><rect x="273" y="214" width="81" height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/><text x="313.5" y="235" text-anchor="middle" class="chip">LLMOps</text><rect x="364" y="214" width="118" height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/><text x="423.0" y="235" text-anchor="middle" class="chip">Évaluation</text>

<rect x="64" y="272" width="366" height="34" rx="17" fill="#dafbe1"/>
<circle cx="84" cy="289" r="5" class="pulse"/>
<circle cx="84" cy="289" r="5" fill="#1a7f37"/>
<text x="100" y="294" class="status">En recherche active · poste en IA générative</text>

<line x1="842" y1="94" x2="842" y2="116" class="flow"/><line x1="842" y1="168" x2="842" y2="190" class="flow"/><line x1="842" y1="242" x2="842" y2="264" class="flow"/>
<g class="node" style="animation-delay:0.0s"><rect x="808" y="42" width="340" height="52" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="826" y="74" class="num">01</text><text x="860" y="74" class="step">question</text><text x="1130" y="74" text-anchor="end" class="detail">« préavis d’un CDI ? »</text></g><g class="node" style="animation-delay:0.9s"><rect x="808" y="116" width="340" height="52" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="826" y="148" class="num">02</text><text x="860" y="148" class="step">retrieve</text><text x="1130" y="148" text-anchor="end" class="detail">bge-m3 · pgvector</text></g><g class="node" style="animation-delay:1.8s"><rect x="808" y="190" width="340" height="52" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="826" y="222" class="num">03</text><text x="860" y="222" class="step">generate</text><text x="1130" y="222" text-anchor="end" class="detail">LLM · prompt versionné</text></g><g class="node" style="animation-delay:2.7s"><rect x="808" y="264" width="340" height="52" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="826" y="296" class="num">04</text><text x="860" y="296" class="step">verify</text><text x="1130" y="296" text-anchor="end" class="detail">sources [1] [2] ✓</text></g>
</svg>
